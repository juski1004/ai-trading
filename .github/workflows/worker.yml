name: 알림·랭킹 서버 배포 (Cloudflare)

# worker/ 가 바뀌어 main 에 들어오거나 수동 실행하면 Cloudflare Workers 에 올린다.
# 필요한 것: Cloudflare API 토큰 하나 (깃허브 시크릿). 이름은 아래 중 무엇이든 된다.
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_API_KEY / CLOUDFLARE / CLOUDFLARE_TOKEN
# 계정 ID(CLOUDFLARE_ACCOUNT_ID)는 없으면 토큰으로 찾는다. KV 저장소와 workers.dev 주소도 없으면 만든다.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_KEY || secrets.CLOUDFLARE || secrets.CLOUDFLARE_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 암호화 테스트
        run: node --test worker/test/*.test.mjs
      - name: 계정·KV·주소 준비
        id: prep
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then echo "::error::Cloudflare 토큰 시크릿이 없습니다 (CLOUDFLARE_API_TOKEN 등)"; exit 1; fi
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          A="${CF_ACCOUNT:-}"
          if [ -z "$A" ]; then
            A=$(api "https://api.cloudflare.com/client/v4/accounts?per_page=5" | jq -r '.result[0].id // empty')
          fi
          [ -n "$A" ] || { echo "::error::Cloudflare 계정을 찾지 못했습니다. 토큰 권한(Account Settings: Read)을 확인해 주세요."; exit 1; }
          echo "::add-mask::$A"
          # KV 저장소 (이름 ai-lab), 없으면 만들기
          KV=$(api "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces?per_page=100" | jq -r '.result[]? | select(.title=="ai-lab") | .id' | head -1)
          if [ -z "$KV" ]; then
            KV=$(api -X POST "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces" -d '{"title":"ai-lab"}' | jq -r '.result.id // empty')
          fi
          [ -n "$KV" ] || { echo "::error::KV 저장소를 만들지 못했습니다"; exit 1; }
          # workers.dev 주소, 없으면 만들기
          SUB=$(api "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            for name in ailab-juski1004 ailab-juski ai-lab-juski1004-app; do
              SUB=$(api -X PUT "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" -d "{\"subdomain\":\"$name\"}" | jq -r '.result.subdomain // empty')
              [ -n "$SUB" ] && break
            done
          fi
          [ -n "$SUB" ] || { echo "::error::workers.dev 주소를 만들지 못했습니다. Cloudflare 대시보드 Workers & Pages 화면을 한 번 열어 주세요."; exit 1; }
          cat > worker/wrangler.toml <<EOF
          name = "ai-lab"
          main = "src/index.js"
          compatibility_date = "2025-01-15"
          account_id = "$A"
          workers_dev = true

          [[kv_namespaces]]
          binding = "KV"
          id = "$KV"

          [triggers]
          crons = ["0 9 * * 1-5", "10 9 * * 1-5", "40 9 * * 1-5"]  # 18:00·18:10·18:40 KST
          EOF
          sed -i 's/^          //' worker/wrangler.toml
          echo "url=https://ai-lab.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
      - name: 배포
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
        run: npx --yes wrangler@3.90.0 deploy
      - name: 동작 확인
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "${{ steps.prep.outputs.url }}/health"; then echo; break; fi; sleep 10
          done
          curl -sf "${{ steps.prep.outputs.url }}/vapid" | jq -e '.key | length > 80'
      - name: 앱에 서버 주소 알려 주기 (web/app/server.json)
        run: |
          printf '{"url":"%s"}\n' "${{ steps.prep.outputs.url }}" > web/app/server.json
          git config user.name "ai-trading-bot"
          git config user.email "ai-trading-bot@users.noreply.github.com"
          git add web/app/server.json
          git diff --cached --quiet || (git commit -m "알림·랭킹 서버 주소" && git push)
