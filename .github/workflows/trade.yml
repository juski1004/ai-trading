name: AI 모의투자 게임

on:
  schedule:
    # 매매: 하루 한 번. GitHub 예약이 몇 시간씩 늦을 수 있어 장중 4번 시도하고, 먼저 돈 한 번만 매매
    - cron: "47 0,2,4,5 * * 1-5"  # 09:47, 11:47, 13:47, 14:47 KST
    - cron: "7,47 7 * * 1-5" # 화면 데이터·카드뉴스: 평일 16:07·16:47 KST (예약이 밀려도 17:50 인스타 업로드 전에 끝나게 두 번)
  workflow_dispatch:
    inputs:
      command:
        description: "start / cycle / report / data / aicheck / site(화면만 1분 만에 올리기)"
        default: cycle
        type: choice
        options: [start, cycle, report, data, aicheck, site]
      days:
        description: "start 할 때 투자 기간 (7~90일)"
        default: "30"

permissions:
  contents: write
  actions: write   # 60일 멈춤 방지 (워크플로 다시 켜기)
  issues: write    # 문제가 생기면 이슈로 알림 (GitHub가 메일로 보냄)

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"  # 진행 상황이 로그에 바로 보이게
      CMD: ${{ inputs.command || (github.event.schedule == '7,47 7 * * 1-5' && 'data') || 'cycle' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        run: |
          if [ "$CMD" = "start" ]; then
            python -m ai_trading.run start --days "${{ inputs.days }}"
          elif [ "$CMD" = "aicheck" ]; then
            python -m ai_trading.llm
          elif [ "$CMD" = "site" ]; then
            # 화면 파일만 바뀐 경우: 지금 사이트에 있는 데이터(data/)를 그대로 가져와 화면만 새로 올림
            git fetch -q --depth 1 origin site
            git archive origin/site data | tar -x -C web
            git archive origin/site archive 2>/dev/null | tar -x -C web || echo "아카이브 없음"
          elif [ "$CMD" = "data" ]; then
            python -m ai_trading.data.export --out web/data
            # 장마감 요약 아카이브: 사이트에 쌓인 지난 글을 꺼내 오고 오늘 글을 더함 (실패해도 사이트 갱신은 계속)
            (git fetch -q --depth 1 origin site && git archive origin/site archive | tar -x -C web) 2>/dev/null || echo "지난 아카이브 없음 (처음)"
            python -m ai_trading.data.archive web || echo "[아카이브 실패]"
          elif [ "$CMD" = "cycle" ] && [ ! -f game/state.json ]; then
            echo "진행 중인 게임이 없어 건너뜀"
          else
            python -m ai_trading.run "$CMD"
          fi
      - name: 본부장 브리핑 미리 녹음 (일레븐랩스 → 구글 → 엣지 → 구글 번역, 실패해도 계속)
        if: env.CMD == 'data' || env.CMD == 'site'
        continue-on-error: true   # 녹음이 안 돼도 화면 갱신은 그대로 (화면은 기기 목소리로 읽음)
        timeout-minutes: 12
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          pip install -q edge-tts gTTS
          (cd web && python -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=40000 \
            --dump-dom "http://localhost:8000/?view=brieftext" > /tmp/brief.html
          python -m ai_trading.brief_audio /tmp/brief.html web/data/brief
      - name: 장마감 카드 릴스 만들기 (매일 만들어만 둠, 올리는 건 정한 날만 · 실패해도 계속)
        if: env.CMD == 'data'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m ai_trading.data.cards_reel web
      - name: 인스타 릴스 만들기 (화·목·금, 실제 앱 화면 15초 · 실패해도 계속)
        if: env.CMD == 'data'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          rm -rf web/data/reel
          pip install -q playwright
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python -m playwright install chromium >/dev/null 2>&1 || true   # 크롬이 있으면 그걸 쓰고, 없을 때 대비
          python -m ai_trading.reel web
      - name: 게임 기록 저장
        if: env.CMD != 'data' && env.CMD != 'aicheck' && env.CMD != 'site'
        run: |
          git config user.name "ai-trading-bot"
          git config user.email "ai-trading-bot@users.noreply.github.com"
          git add game/ || true
          git diff --cached --quiet || (git commit -m "게임 기록 업데이트" && git push)
      - name: 화면을 site 브랜치에 올리기 (기록 없이 매번 덮어씀)
        if: env.CMD == 'data' || env.CMD == 'site'
        run: |
          rm -rf /tmp/site && cp -r web /tmp/site && cd /tmp/site
          git init -q && git checkout -q -b site
          git config user.name "ai-trading-bot"
          git config user.email "ai-trading-bot@users.noreply.github.com"
          git add -A && git commit -qm "화면 데이터 $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

      # ---------- 자동 점검과 알림 ----------
      - name: 데이터 점검 (비거나 오래된 항목 찾기)
        if: env.CMD == 'data'
        run: |
          python -m ai_trading.data.health web/data | tee /tmp/health.md
          {
            echo ""
            echo "실행 기록: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> /tmp/health.md
      - name: 점검 결과를 이슈로 알림 (문제 있으면 열고, 없어지면 닫음)
        if: env.CMD == 'data'
        run: |
          gh label create "자동점검" --color d93f0b --description "자동 실행이 찾은 문제" 2>/dev/null || true
          num=$(gh issue list --label "자동점검" --state open --json number -q '.[0].number')
          if head -1 /tmp/health.md | grep -q "^문제 없음"; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "다시 점검해 보니 문제가 없어 닫습니다. $(date -u +%F)"; fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body-file /tmp/health.md
          else
            gh issue create --title "[자동 점검] 화면 데이터에 문제가 있습니다" --label "자동점검" --body-file /tmp/health.md
          fi
      - name: 실행 실패 알림
        if: failure()
        run: |
          gh label create "자동점검" --color d93f0b --description "자동 실행이 찾은 문제" 2>/dev/null || true
          body="자동 실행($CMD)이 실패했습니다. 실행 기록에서 빨간 단계를 확인하세요: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          num=$(gh issue list --label "자동점검" --state open --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "[자동 점검] 자동 실행 실패 ($CMD)" --label "자동점검" --body "$body"; fi
      - name: 60일 멈춤 방지 (예약 실행 다시 켜두기)
        if: always()
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/trade.yml/enable" || true
