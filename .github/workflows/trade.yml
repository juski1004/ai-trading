name: AI 모의투자 게임

on:
  schedule:
    - cron: "*/30 0-6 * * 1-5"    # 한국 장 (KST 09:00~15:30)
    - cron: "*/30 13-21 * * 1-5"  # 미국 장 (서머타임 여부와 상관없이 커버)
  workflow_dispatch:
    inputs:
      command:
        description: "start / cycle / report"
        default: cycle
        type: choice
        options: [start, cycle, report]
      days:
        description: "start 할 때 투자 기간 (7~90일)"
        default: "30"

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CMD="${{ inputs.command || 'cycle' }}"
          if [ "$CMD" = "start" ]; then
            python -m ai_trading.run start --days "${{ inputs.days }}"
          elif [ "$CMD" = "cycle" ] && [ ! -f game/state.json ]; then
            echo "진행 중인 게임이 없어 건너뜀"
          else
            python -m ai_trading.run "$CMD"
          fi
      - name: 결과 저장
        run: |
          git config user.name "ai-trading-bot"
          git config user.email "ai-trading-bot@users.noreply.github.com"
          git add game/ || true
          git diff --cached --quiet || (git commit -m "게임 기록 업데이트" && git push)
