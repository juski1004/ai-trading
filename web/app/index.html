<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 투자연구소</title>
<meta name="description" content="AI 종목분석과 모의투자 게임 (참고용, 투자 권유 아님)">
<meta name="theme-color" content="#1c2b5a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI투자연구소">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --soft:#eef1f7; --line:#e3e7ef; --fg:#121826; --muted:#5d6779; --dim:#8b94a5;
  --brand:#1c2b5a; --brand2:#3450a8; --accent:#ff5c6c;
  --up:#e5323f; --down:#1f6fe5; --pos:#0f9d6e; --neg:#d94a4a; --neu:#8b94a5;
  --nav-h:62px;
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e121b; --card:#171c28; --soft:#1f2635; --line:#2a3245; --fg:#e9edf5; --muted:#a3acbd; --dim:#6f7a8f;
  --brand:#7e9bff; --brand2:#9db2ff; --up:#ff5a66; --down:#4d93ff;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}

/* 상단 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;max-width:560px;margin:0 auto}
.top img{width:30px;height:30px;border-radius:8px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.3px}
.beta{font-size:10.5px;font-weight:600;color:var(--brand2);border:1px solid var(--brand2);border-radius:20px;padding:0 6px;margin-left:2px}
.top .asof{margin-left:auto;font-size:12px;color:var(--muted)}

/* 카드 */
.card{background:var(--card);border-radius:16px;padding:16px;margin-top:12px;box-shadow:0 1px 2px rgba(18,24,38,.04)}
.card h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
.card .sub{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}

/* 시장 */
.mkt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mk{background:var(--soft);border-radius:12px;padding:10px 11px;min-width:0}
.mk .k{font-size:12px;color:var(--muted)}
.mk .v{font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.mk .c{font-size:12.5px;font-weight:600}
.mood{margin-top:12px;font-size:14px}
.mood b{font-weight:700}
.bar3{display:flex;height:8px;border-radius:8px;overflow:hidden;margin-top:8px;background:var(--soft)}
.bar3 i{display:block}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--c)}

/* 종목 목록 */
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list li:first-child .row{border-top:0}
.rank{font-size:14px;font-weight:700;color:var(--brand2);text-align:center}
.nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--muted)}
.rt{text-align:right}
.px{font-weight:600;font-size:15px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:1px 8px;margin-top:2px}
.chip.긍정{background:rgba(15,157,110,.12);color:var(--pos)}
.chip.중립{background:var(--soft);color:var(--muted)}
.chip.부정{background:rgba(217,74,74,.12);color:var(--neg)}
.sc{font-size:12px;color:var(--muted)}
.sc b{font-size:15px;color:var(--fg)}

.note{font-size:12px;color:var(--dim);line-height:1.6;margin:16px 4px 0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.skel{height:14px;border-radius:6px;background:var(--soft);margin:10px 0;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{50%{opacity:.5}}

/* 준비 중 화면 */
.soon{text-align:center;padding:36px 12px}
.soon .ic{font-size:40px}
.soon h2{margin:8px 0 4px}
.soon p{color:var(--muted);font-size:14px;margin:0}
.soon a{color:var(--brand2)}

/* 아래 탭 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--dim);text-decoration:none}
nav a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav a[aria-current="page"]{color:var(--brand);font-weight:600}
a:focus-visible,button:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
</style>
</head>
<body>
<header class="top">
  <img src="icon-192.png" alt="">
  <h1>AI 투자연구소</h1><span class="beta">베타</span>
  <span class="asof" id="asof"></span>
</header>

<main class="wrap" id="view" aria-live="polite"></main>

<nav aria-label="메뉴"><div class="in">
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>홈</a>
  <a href="#analysis" data-tab="analysis"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/><path d="M8 12.5l2-2 1.5 1.5L14 9"/></svg>분석</a>
  <a href="#game" data-tab="game"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>투자게임</a>
  <a href="#me" data-tab="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>내 정보</a>
</div></nav>

<script>
(()=>{
const $=s=>document.querySelector(s);
const won=n=>Math.round(n).toLocaleString('ko-KR');
const pct=x=>(x>0?'+':'')+x.toFixed(2)+'%';
const cls=x=>x>0?'up':x<0?'down':'flat';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const pts=s=>Math.round((s+1)/2*100);  // -1~+1 → 0~100점
let SC=null,META={},ERR=null;

async function load(){
  const get=async f=>{const r=await fetch('../data/'+f,{cache:'no-cache'});if(!r.ok)throw new Error(f+' '+r.status);return r.json()};
  try{[SC,META]=await Promise.all([get('scores.json'),get('meta.json').catch(()=>({}))])}catch(e){ERR=e}
  route();
}

/* ---------- 홈 ---------- */
function home(){
  if(ERR)return `<div class="card"><h2>데이터를 불러오지 못했어요</h2><p class="sub">잠시 뒤 다시 열어 주세요. (${esc(ERR.message)})</p></div>`;
  if(!SC)return `<div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div>`.repeat(2);
  const M=SC.market||{},S=Object.entries(SC.stocks);
  const mk=(k,lab,dec)=>{const x=M[k];if(!x)return'';return `<div class="mk"><div class="k">${lab}</div><div class="v num">${x.v.toLocaleString('ko-KR',{minimumFractionDigits:dec,maximumFractionDigits:dec})}</div><div class="c num ${cls(x.chg)}">${x.chg>0?'▲':x.chg<0?'▼':''} ${Math.abs(x.chg).toFixed(2)}%</div></div>`};
  const cnt={긍정:0,중립:0,부정:0};S.forEach(([,s])=>cnt[s.label]++);const n=S.length||1;
  const joy=(S[0]&&S[0][1].opinions.find(o=>o.agent==='JOY'))||null;
  const mood=cnt.긍정>cnt.부정?'좋은 편':cnt.부정>cnt.긍정*2?'약한 편':'엇갈리는 편';
  const top=[...S].sort((a,b)=>b[1].score-a[1].score).slice(0,5);
  const hot=S.filter(([,s])=>s.vol_ratio).sort((a,b)=>b[1].vol_ratio-a[1].vol_ratio).slice(0,5);
  const row=([sym,s],k,right)=>`<li><button class="row" data-sym="${esc(sym)}" type="button">
      <span class="rank num">${k+1}</span>
      <span style="min-width:0"><div class="nm">${esc(s.name)}</div><div class="meta num">${esc(s.code)} · <span class="${cls(s.chg)}">${pct(s.chg)}</span></div></span>
      <span class="rt">${right(s)}</span></button></li>`;
  return `
  <section class="card" aria-labelledby="h-mkt">
    <div class="hd"><h2 id="h-mkt">오늘의 시장</h2><span class="sub">${esc(SC.date)} 장 마감</span></div>
    <div class="mkt">${mk('kospi','코스피',2)}${mk('kosdaq','코스닥',2)}${mk('usdkrw','원/달러',1)}</div>
    <p class="mood">AI가 본 대형주 <b>${S.length}종목</b>의 분위기는 <b>${mood}</b>이에요.${joy?`<br><span class="sub">${esc(joy.summary)}</span>`:''}</p>
    <div class="bar3" aria-hidden="true"><i style="width:${cnt.긍정/n*100}%;background:var(--pos)"></i><i style="width:${cnt.중립/n*100}%;background:var(--neu)"></i><i style="width:${cnt.부정/n*100}%;background:var(--neg)"></i></div>
    <div class="legend"><span style="--c:var(--pos)">긍정 ${cnt.긍정}</span><span style="--c:var(--neu)">중립 ${cnt.중립}</span><span style="--c:var(--neg)">부정 ${cnt.부정}</span></div>
  </section>
  <section class="card" aria-labelledby="h-top">
    <div class="hd"><div><h2 id="h-top">AI 점수 상위 종목</h2><p class="sub">차트·거래량·시장 흐름을 합친 점수 (100점 만점)</p></div></div>
    <ul class="list">${top.map((x,k)=>row(x,k,s=>`<div class="px num">${won(s.price)}</div><div class="sc num"><b>${pts(s.score)}</b>점 <span class="chip ${s.label}">${s.label}</span></div>`)).join('')}</ul>
  </section>
  <section class="card" aria-labelledby="h-hot">
    <div class="hd"><div><h2 id="h-hot">거래량 급증 종목</h2><p class="sub">최근 20일 평균보다 거래가 많이 몰린 종목</p></div></div>
    <ul class="list">${hot.map((x,k)=>row(x,k,s=>`<div class="px num">${won(s.price)}</div><div class="sc num">평소의 <b>${s.vol_ratio.toFixed(1)}</b>배</div>`)).join('')}</ul>
  </section>
  <p class="note">AI 점수는 공개된 시세와 지표로 계산한 참고 정보이며 투자 권유가 아닙니다. 시세는 15~20분 이상 늦을 수 있고, 투자 판단과 결과의 책임은 본인에게 있습니다.</p>`;
}

/* ---------- 준비 중 탭 ---------- */
const soon=(ic,t,d)=>`<div class="card soon"><div class="ic" aria-hidden="true">${ic}</div><h2>${t}</h2><p>${d}</p></div>`;
function analysis(sym){
  const s=SC&&sym?SC.stocks[sym]:null;
  return soon('🔍',s?`${esc(s.name)} 분석`:'종목분석기',`종목 검색과 진단 카드(목표가·손절가, 재무·기술 점수, 뉴스 AI 요약)가 다음 단계에서 열려요.`);
}
const game=()=>soon('🎮','모의투자 게임','가상 1,000만 원으로 1주~3개월 동안 AI 운용팀과 수익률을 겨루는 게임이 곧 열려요.');
const me=()=>soon('👤','내 정보','게임 기록과 지난 성적표가 여기에 모여요.<br><br><span class="sub">휴대폰 홈 화면에 추가하면 앱처럼 쓸 수 있어요.<br>아이폰: 공유 → 홈 화면에 추가 · 안드로이드: 메뉴 → 홈 화면에 추가</span>');

/* ---------- 화면 전환 ---------- */
function route(){
  const [tab,arg]=(location.hash.slice(1)||'home').split('/');
  const t=['home','analysis','game','me'].includes(tab)?tab:'home';
  document.querySelectorAll('nav a').forEach(a=>a.dataset.tab===t?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  $('#view').innerHTML=t==='home'?home():t==='analysis'?analysis(arg&&decodeURIComponent(arg)):t==='game'?game():me();
  $('#asof').textContent=SC?`${SC.date.slice(5).replace('-','.')} 기준`:'';
  window.scrollTo(0,0);
}
$('#view').addEventListener('click',e=>{const b=e.target.closest('[data-sym]');if(b)location.hash='analysis/'+encodeURIComponent(b.dataset.sym)});
addEventListener('hashchange',route);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
route();load();
})();
</script>
</body>
</html>
